sonar.projectKey=bizops-website-v3
sonar.projectName=BizOps Website V3
sonar.projectVersion=3.0.0

# Path to source directories
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/*.test.ts,**/*.test.tsx,**/*.stories.ts,**/*.stories.tsx,**/mocks/**,**/coverage/**,**/.next/**

# Path to test directories
sonar.tests=tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# TypeScript configuration
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Rules
sonar.typescript.exclusions=**/node_modules/**,**/*.d.ts

# Quality Gate
sonar.qualitygate.wait=true
